name: opportunity-scout

on:
  schedule:
    # Portugal observes DST. Both crons fire daily; main.py's guard runs only
    # the one landing inside 06:00-07:00 Europe/Lisbon (the other exits in
    # seconds). 30 5 UTC = 06:30 local in summer (WEST), 30 6 UTC in winter (WET).
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch: {}        # manual runs bypass the hour guard

permissions:
  contents: write              # needed to commit data/seen.jsonl + state back

concurrency:
  group: opportunity-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest     # 1x minute multiplier
    timeout-minutes: 25        # belt-and-braces over the internal 20-min stop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scout
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      - name: Commit state back to the repo
        # The Actions cache evicts after 7 days idle; the repo does not.
        # seen.jsonl is the dedup history — losing it would silently reset
        # everything, so it lives in git. Skip the commit when nothing changed.
        run: |
          git config user.name "opportunity-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "state: $(date -u +%Y-%m-%d) run"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
