  - "speed dating"
  - "singles"
  - "board ?game"
  - "boardgame"
  - "jogos de tabuleiro"
  - "quiz night"
  - "noite de quiz"
  - "craft beer"
  - "cerveja"
  - "wine tasting"
  - "prova de vinhos"
  - "psychic"
  - "hypnothera"
  - "tarot"
  - "astrolog"
  - "manifest"
  - "spiritual"
  - "meditation"
  - "medita[çc][ãa]o"
  - "yoga"
  - "breathwork"
  - "sound bath"
  - "dinner with"
  - "jantar"
  - "supper club"
  - "language exchange"
  - "conversa[çc][ãa]o em"
  - "walking (meetup|group|tour)"
  - "10000 steps"
  - "\\bkayak"
  - "\\bhik(e|ing)\\b"
  - "\\bpicnic"
  - "scenic walk"
  - "passeio"
  - "beach day"
  - "\\bbrunch"
  - "salsa|kizomba|bachata"
