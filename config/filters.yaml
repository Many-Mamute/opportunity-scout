# All behaviour knobs live here. sources.yaml only lists where to look.

settings:
  target_hour: 5            # local hour both crons must land in
  send_at: "06:00"          # exact delivery time; the deliver job sleeps to it
  max_send_wait_min: 20     # never hold a runner longer than this              # local Europe/Lisbon hour the scheduled run may execute in
  timezone: Europe/Lisbon
  max_runtime_min: 18        # cron fires 06:05, so worst case lands 06:23 — before 06:30         # hard stop: send what we have
  tavily_daily_cap: 60       # ~23 per run: the scheduled run plus two manual tests
  tavily_monthly_cap: 900    # the real guard on the 1,000/month free tier
  # 15 sweep + up to 8 enrichment = 23/run -> ~690/month, inside the cap.
  gemini_run_cap: 30          # max LLM calls per run
  gemini_batch_size: 10       # candidate pages per LLM call
  gemini_model: gemini-2.5-flash-lite
  gemini_seconds_between_calls: 5   # free tier ~15 RPM
  top_section_cap: 10       # the daily shortlist you actually read
  reject_night_online: false  # false = flag awkward online hours, you decide
  enrichment_max_events: 8   # searches per run for missing dates/cost/organiser
  thin_digest_threshold: 6   # below this many qualifying events, sweep wider
  eligibility_horizon_days: 240   # how far ahead to mention "not yet" events
  enrichment_retry_days: 14  # don't re-search an event that had no coverage
  low_confidence_cap: 4      # snippets are leads, not a second digest
  max_total_events: 16       # ceiling on full cards; the roundup below is unlimited
  max_detail_pages_per_source: 8
  backfill_detail_multiplier: 3

# --------------------------------------------------------------- stage 1 triage
# A social event in Porto is still a social event. These override everything:
# if the title/summary matches, the item is dropped no matter how it scored.
