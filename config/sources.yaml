  # ---------------- Tier 2: Tavily-budgeted sweep (max 30 queries/day) ------
  - name: tavily-linkedin
    tier: 2
    type: tavily
    queries:
      - "site:linkedin.com/posts internship Porto engenharia mecânica estágio"
      - "site:linkedin.com/posts hackathon Porto engineering students"
      - "site:linkedin.com/events Porto engineering competition"
