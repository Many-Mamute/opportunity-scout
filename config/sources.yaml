# Adding a source: append one entry (name, tier, type, urls|queries) — under
# 10 lines, no code changes. Types are handled generically by sources/handlers.py:
#   page   - fetch url(s); parse JSON-LD Events; harvest links matching
#            link_pattern (regex, optional), triage anchor text, fetch survivors.
#   rss    - fetch a feed; triage entries; fetch survivors.
#   tavily - budgeted search queries (Tier 2 only).
# Any source may set: enabled: false, max_detail: N, notes: free text.
# URLs are best-known at build time; a dead one shows up in the diagnostics
# section of the email and is a one-line fix here.

sources:
  # ---------------- Tier 1: free direct fetch / RSS (the backbone) ----------
  - name: eventbrite-porto
    enabled: false          # dead on 2026-08-13 run: HTTP 405 — Eventbrite blocks non-browser GETs on /d/ search pages
    tier: 1
    type: page
    urls:
      - "https://www.eventbrite.com/d/portugal--porto/engineering/"
      - "https://www.eventbrite.com/d/portugal--porto/business/"
      - "https://www.eventbrite.com/d/online/hackathon/"
    link_pattern: "/e/"

  - name: luma-porto
    tier: 1
