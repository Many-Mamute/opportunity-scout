  # ---------------- Tier 2: Tavily-budgeted sweep (max 30 queries/day) ------
  - name: tavily-linkedin
    tier: 2
    type: tavily
    max_results: 4
    queries:
      - "estágio verão engenharia mecânica Porto 2027 candidaturas abertas"
      - "hackathon Porto engineering students 2026 registration open"
      - "FEUP núcleo estudantes recrutamento 2026 2027 candidaturas"

  - name: tavily-facebook
    tier: 2
    type: tavily
    max_results: 4
    queries:
      - "site:facebook.com/events Porto hackathon competição engenharia 2026"

  - name: tavily-prestige
    tier: 2
    type: tavily
    max_results: 4
    queries:
      - "CERN summer student programme 2027 applications open undergraduate"
      - "ESA education student opportunities 2027 application deadline"
      - "European summer school mechanical engineering 2027 funded undergraduate"
      - "Formula Student team recruiting members Portugal 2026 2027 applications"
      - "Shell Eco-marathon Europe 2027 team registration deadline"
      - "public speaking debate workshop Porto 2026 oratória comunicação"
      - "literacia financeira workshop Porto online gratuito 2026"
      - "torneio de debate universitário Portugal 2027 inscrições"
      - "Toastmasters Porto reunião aberta visitantes"
      - "concurso engenharia mecânica estudantes Portugal 2027"
      - "bolsa estágio verão engenharia Porto 2027"

  # ---------------- Fallback: only runs on a quiet week ---------------------
  # Deliberately broader and vaguer than the daily sweep. These trade precision
  # for coverage, which is the right trade only when the precise queries came
  # back nearly empty. Marked `fallback: true` so they never run otherwise.
  - name: tavily-fallback
    tier: 2
    type: tavily
    fallback: true
    max_results: 6
    queries:
      - "oportunidades estudantes engenharia Porto próximos meses"
      - "student competition Europe 2027 undergraduate applications open"
      - "workshop gratuito estudantes universitários Porto inscrições"
      - "summer programme 2027 undergraduate engineering applications"
      - "concurso ideias jovens Portugal 2027 candidaturas"
      - "evento estudantes universidade do porto próximas semanas"
